name: Error
description: Comunicar un fallo reproducible
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: "1. Abrir..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado real
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Dispositivo, versión Android y versión de la app
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Capturas o registros sin datos privados
